<style>:root{--bg:#0b0e13;--panel:#121722;--panel2:#171d2a;--line:#232b3a;--txt:#e6e2d8;--mut:#8a93a6;--gold:#e3b55e;--gold2:#b98a37;--red:#d9534f;--green:#4caf7a;--blue:#5aa0e8;--paper:#f2ead8;--ink:#2a241c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea{font:inherit}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#2a3242;border-radius:6px}
#fog{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#fog i{position:absolute;width:70vw;height:70vh;border-radius:50%;filter:blur(90px);opacity:.13;background:radial-gradient(circle,#6f7d99,transparent 70%);animation:drift 40s ease-in-out infinite alternate}
#fog i:nth-child(2){left:40vw;top:30vh;animation-duration:55s;background:radial-gradient(circle,#8a6d43,transparent 70%);opacity:.08}
@keyframes drift{from{transform:translate(-10vw,-5vh)}to{transform:translate(15vw,10vh) scale(1.2)}}
#app{position:relative;z-index:1;height:100%}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* --- титул --- */
.title{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.logoimg{width:120px;height:120px;filter:drop-shadow(0 6px 24px rgba(227,181,94,.35))}
.logo{font-family:Georgia,serif;font-size:74px;font-weight:700;letter-spacing:10px;margin:0;background:linear-gradient(180deg,#f6dc9c,#c8933d 60%,#8c6422);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-family:Georgia,serif;font-style:italic;color:var(--mut);font-size:19px;margin-top:-4px}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:22px;width:360px}
.btn{background:linear-gradient(180deg,#232a37,#1a1f29);border:1px solid #39404f;color:#efe7d6;padding:11px 18px;border-radius:9px;transition:.15s;text-align:center}
.btn:hover{border-color:var(--gold);color:#fff}
.btn.gold{background:linear-gradient(180deg,#e9bf6a,#b98a37);color:#1b1408;border-color:#f1cf86;font-weight:700}
.btn.red{background:linear-gradient(180deg,#a8403a,#7a2a26);border-color:#c0504a;color:#fff;font-weight:700}
.btn.sm{padding:6px 11px;font-size:13.5px;border-radius:7px}
.btn:disabled{opacity:.4;cursor:default}
.casecard{background:linear-gradient(160deg,#f3ead6,#ddcfae);color:var(--ink);border-radius:6px;padding:18px 20px;text-align:left;border-top:22px solid #c9b48a;position:relative;box-shadow:0 10px 26px rgba(0,0,0,.45);cursor:pointer;transition:.2s}
.casecard:hover{transform:translateY(-3px)}
.casecard:before{content:"ДЕЛО №" attr(data-n);position:absolute;top:-19px;left:14px;font-size:12px;letter-spacing:2px;color:#5c4a2b;font-weight:700}
.casecard h3{margin:0 0 4px;font-family:Georgia,serif;font-size:22px}
.casecard .m{font-size:13px;color:#6b5d45}
.casecard.lock{filter:grayscale(1) brightness(.5);cursor:default}

/* --- рабочий стол --- */
.desk{display:grid;grid-template-columns:230px 1fr;height:100%}
.side{background:linear-gradient(180deg,#0f131b,#0c0f15);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:3px}
.side .brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.side .brand svg{width:38px;height:38px}
.side .brand b{font-family:Georgia,serif;letter-spacing:2px;color:var(--gold);font-size:17px}
.side .brand small{display:block;color:var(--mut);font-size:11.5px;letter-spacing:.5px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:9px;border:1px solid transparent;background:none;text-align:left;color:#cfd5e2;font-size:15px;position:relative}
.nav:hover{background:#161c28}
.nav.on{background:#1b2232;border-color:#2b3548;color:#fff}
.nav .ic{width:24px;text-align:center;font-size:18px}
.nav .bd{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:700}
.nav .bd.g{background:var(--gold2)}
.side .sp{flex:1}
.myphone{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#151b27;border:1px solid #273046;color:#dfe5f0}
.myphone:hover{border-color:var(--gold)}
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line);background:rgba(11,14,19,.75);backdrop-filter:blur(6px);min-height:58px}
.topbar h1{font-family:Georgia,serif;font-size:21px;margin:0;font-weight:600}
.topbar .sp{flex:1}
.chip{background:#171d2a;border:1px solid #29324a;border-radius:20px;padding:5px 12px;font-size:13px;color:#cdd3e0;display:flex;align-items:center;gap:6px}
.pending{display:flex;gap:6px}
.pending .chip{border-color:#3b4a6a;color:#a8c4ff}
.spin{width:12px;height:12px;border:2px solid #3b4a6a;border-top-color:#8ab4ff;border-radius:50%;animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.content{flex:1;overflow:auto;padding:22px 26px}
.h2{font-family:Georgia,serif;font-size:24px;margin:0 0 4px}
.hint{color:var(--mut);font-size:14px;margin:0 0 16px}
.grid{display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card.click{cursor:pointer;transition:.15s}
.card.click:hover{border-color:#3a4660;transform:translateY(-2px)}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:2px 7px;margin:2px 4px 2px 0;background:#232b3d;color:#c8d0e0}
.tag.red{background:#4a1f22;color:#ffb0aa}.tag.green{background:#1d3a2a;color:#a8e8c0}.tag.gold{background:#43361a;color:#f0d08a}.tag.blue{background:#1e2e4a;color:#a8c8ff}
.newdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:6px;vertical-align:middle}

/* дело */
.paper{background:linear-gradient(170deg,#f4ecda,#e2d4b4);color:var(--ink);border-radius:6px;padding:24px 28px;box-shadow:0 14px 40px rgba(0,0,0,.45);position:relative}
.paper p{font-family:Georgia,serif;font-size:16px;line-height:1.6;margin:10px 0}
.paper .stamp{position:absolute;right:24px;top:20px;border:3px solid #b33a3a;color:#b33a3a;padding:3px 10px;font-weight:800;transform:rotate(8deg);letter-spacing:2px;opacity:.8}
.tasks{list-style:none;padding:0;margin:0}
.tasks li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.tasks li .ck{width:20px;height:20px;border-radius:5px;border:2px solid #4a5570;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:13px}
.tasks li.done{color:var(--mut);text-decoration:line-through}
.tasks li.done .ck{background:var(--green);border-color:var(--green);color:#fff}

/* карта */
.loc{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel);cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.loc:hover{transform:translateY(-3px);border-color:#3a4660}
.loc .art{height:110px;position:relative;display:flex;align-items:flex-end;padding:12px 14px}
.loc .art .em{position:absolute;right:16px;top:14px;font-size:46px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.loc .art b{font-family:Georgia,serif;font-size:19px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.loc .bd{padding:10px 14px;font-size:13px;color:var(--mut)}
.scene{border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.scene .art{height:170px;position:relative;padding:20px 24px;display:flex;flex-direction:column;justify-content:flex-end}
.scene .art .em{position:absolute;right:30px;top:20px;font-size:80px;opacity:.9}
.scene .art h2{margin:0;font-family:Georgia,serif;font-size:28px;text-shadow:0 2px 10px rgba(0,0,0,.7)}
.scene .art small{color:#d0d6e2}
.scene .body{background:var(--panel);padding:18px 24px}
.scene .desc{font-family:Georgia,serif;font-size:16px;line-height:1.6;color:#d8d3c6;margin:0 0 16px}
.spot{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;transition:.15s}
.spot:hover{border-color:var(--gold)}
.spot .i{font-size:20px}
.spot.done{opacity:.6}
.spot .res{font-family:Georgia,serif;color:#d8d3c6;line-height:1.55;font-size:15px}
.person{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;transition:.15s}
.person:hover{border-color:var(--gold)}
.person .ph{width:62px;height:74px;border-radius:8px;overflow:hidden;flex:none}
.person .ph svg{width:100%;height:100%;display:block}
.person b{display:block;font-size:15.5px}
.person small{color:var(--mut)}

/* люди / база */
.dossier{display:grid;grid-template-columns:200px 1fr;gap:20px}
.dossier .ph{border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.dossier .ph svg{width:100%;display:block}
.dossier table{border-collapse:collapse;width:100%;font-size:14.5px}
.dossier td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.dossier td:first-child{color:var(--mut);width:150px}
.search{display:flex;gap:10px;margin-bottom:16px}
.search input{flex:1;background:#0f141d;border:1px solid #2c3550;border-radius:10px;padding:12px 14px;color:#fff;font-size:16px;outline:none}
.search input:focus{border-color:var(--gold)}
.dbhead{background:#0e1622;border:1px solid #1f3350;border-radius:10px;padding:10px 14px;font-family:Consolas,monospace;color:#7fb2ff;font-size:13px;margin-bottom:14px}

/* улики */
.ev{display:flex;gap:12px;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:.15s;align-items:flex-start}
.ev:hover{border-color:#3a4660}
.ev .i{width:46px;height:46px;border-radius:10px;background:linear-gradient(160deg,#232b3d,#171d2a);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.ev b{display:block;font-size:14.5px}
.ev small{color:var(--mut);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev.sel{border-color:var(--gold);background:#1d2232}

/* телефоны */
.phonewrap{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
.phone{width:360px;height:700px;border-radius:44px;background:#0a0a0c;border:10px solid #1c1c22;box-shadow:0 0 0 2px #333,0 30px 60px rgba(0,0,0,.6);position:relative;overflow:hidden;display:flex;flex-direction:column;flex:none}
.phone .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:100px;height:24px;border-radius:14px;background:#000;z-index:3}
.phone .stat{display:flex;justify-content:space-between;padding:12px 26px 6px;font-size:12.5px;font-weight:600;color:#fff;z-index:2}
.phone .scr{flex:1;overflow:auto;position:relative}
.phone .tabs{display:flex;border-top:1px solid #222;background:#111;flex:none}
.phone .tabs button{flex:1;background:none;border:0;padding:9px 0 12px;color:#888;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
.phone .tabs button span{font-size:19px}
.phone .tabs button.on{color:#4ea3ff}
.plock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:60px;color:#fff}
.plock .time{font-size:64px;font-weight:300}
.plock .dots{display:flex;gap:14px;margin:20px 0 26px}
.plock .dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid #fff}
.plock .dots i.f{background:#fff}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.14);border:0;color:#fff;font-size:28px;font-weight:300}
.pad button:hover{background:rgba(255,255,255,.25)}
.plock.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.plist .row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #1b1b1f;cursor:pointer;color:#eee}
.plist .row:hover{background:#151519}
.plist .av{width:42px;height:42px;border-radius:50%;background:linear-gradient(160deg,#3a4a6a,#2a3048);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.plist .row small{color:#888;display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.plist .row .r{margin-left:auto;color:#777;font-size:11.5px;text-align:right}
.chathead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #222;color:#fff;position:sticky;top:0;background:#0d0d10;z-index:2}
.bubbles{padding:12px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:78%;padding:8px 12px;border-radius:16px;font-size:14px;line-height:1.35;position:relative}
.bub.them{background:#26262b;color:#eee;align-self:flex-start;border-bottom-left-radius:4px}
.bub.me{background:#2f6fe0;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.bub .tm{display:block;font-size:10.5px;opacity:.6;margin-top:3px}
.bub.del{outline:2px dashed #e05a5a}
.bub .pin{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--gold);color:#000;border:0;font-size:12px;display:none}
.bub:hover .pin,.pinbtn{display:block}
.bub .pin.got{display:block;background:var(--green);color:#fff}
.restored{background:#3a1515;color:#ffb0aa;font-size:12px;text-align:center;padding:6px;border-radius:8px;margin:6px 12px}
.callrow .ic{width:30px;text-align:center;font-size:17px}
.memo,.note{margin:12px;padding:14px;border-radius:14px;background:#1a1a1f;color:#ddd;line-height:1.5;font-size:14px;white-space:pre-wrap}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px}
.photos div{border-radius:8px;overflow:hidden;cursor:pointer;position:relative}
.photos svg{width:100%;display:block}
.photo{width:100%;display:block}
.side-info{flex:1;min-width:280px;max-width:520px}

/* банк */
.bank table{width:100%;border-collapse:collapse;font-size:14px}
.bank th{text-align:left;color:var(--mut);font-weight:600;padding:8px;border-bottom:1px solid var(--line);font-size:12.5px;text-transform:uppercase;letter-spacing:.5px}
.bank td{padding:9px 8px;border-bottom:1px solid #1b2130}
.bank td.plus{color:#7fe0a8;font-weight:600;text-align:right;white-space:nowrap}
.bank td.minus{color:#ff9a90;font-weight:600;text-align:right;white-space:nowrap}
.bank tr.hl td{background:#1f1d14}
.bankhead{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#123a2a,#0f2a3a);border-radius:12px;padding:14px 18px;margin-bottom:12px}
.bankhead .logo2{width:42px;height:42px;border-radius:10px;background:#1fa36a;display:flex;align-items:center;justify-content:center;font-size:22px}

/* прослушка */
.tape{background:#0e1218;border:1px solid #233048;border-radius:12px;padding:16px;margin-bottom:14px}
.wave{height:34px;display:flex;align-items:center;gap:2px;margin:8px 0 12px}
.wave i{flex:1;background:#3a7aff;border-radius:2px;opacity:.7}
.tr{font-family:Consolas,monospace;font-size:14px;line-height:1.6}
.tr b{color:#8ab4ff}
.tr .n{color:var(--mut);font-style:italic}

/* оверлеи */
.ov{position:fixed;inset:0;background:rgba(4,6,10,.78);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:center;justify-content:center;animation:fade .2s}
.modal{background:var(--panel);border:1px solid #2a3348;border-radius:16px;width:min(760px,94vw);max-height:90vh;overflow:auto;padding:24px 28px;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.modal h2{margin:0 0 8px;font-family:Georgia,serif}
.modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.labbox{background:#10202a;border:1px solid #23485a;border-radius:10px;padding:12px 14px;margin-top:12px;font-size:14.5px;line-height:1.5}
.labbox.done{background:#132418;border-color:#2c5a3a}

/* разговор */
.talk{width:min(1100px,96vw);height:min(760px,92vh);display:grid;grid-template-columns:300px 1fr;background:var(--panel);border:1px solid #2a3348;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.talk .who{background:linear-gradient(180deg,#151b27,#0f131b);padding:22px;display:flex;flex-direction:column;gap:12px;border-right:1px solid var(--line)}
.talk .who .ph{border-radius:12px;overflow:hidden;border:1px solid #2a3348;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.talk .who .ph svg{width:100%;display:block}
.talk .who h3{margin:0;font-family:Georgia,serif;font-size:21px}
.talk .log{flex:1;overflow:auto;padding:22px 26px;display:flex;flex-direction:column;gap:10px}
.talk .r{display:flex;flex-direction:column;min-height:0}
.ln{max-width:85%;line-height:1.5;font-size:15.5px;animation:fade .25s}
.ln.p{background:#1d2333;border:1px solid #2a3348;padding:10px 14px;border-radius:14px;border-top-left-radius:4px;align-self:flex-start}
.ln.me{background:#2b3e5f;padding:10px 14px;border-radius:14px;border-top-right-radius:4px;align-self:flex-end;color:#fff}
.ln.n{align-self:center;color:#9aa3b8;font-style:italic;font-family:Georgia,serif;text-align:center;max-width:92%}
.ln.lie{align-self:center;background:#4a1f22;color:#ffcfca;border:1px solid #8a3a3a;padding:6px 14px;border-radius:20px;font-weight:700;letter-spacing:.5px}
.ln.ev{align-self:flex-end;background:#3a3018;border:1px solid #6a5420;color:#f0d08a;padding:8px 14px;border-radius:12px}
.topics{border-top:1px solid var(--line);padding:14px 18px;display:flex;flex-wrap:wrap;gap:8px;background:#0f131b;max-height:40%;overflow:auto}
.topic{background:#1a2131;border:1px solid #2c3650;border-radius:10px;padding:8px 13px;text-align:left;font-size:14px;color:#dfe5f0}
.topic:hover{border-color:var(--gold)}
.topic.done{opacity:.5}
.topic.new{border-color:#6a5420;background:#2a2516}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;max-height:56vh;overflow:auto;margin-top:10px}

/* мой телефон / звонок */
.call{width:360px;border-radius:36px;background:linear-gradient(180deg,#1a2335,#0b0f18);border:8px solid #1c1c22;padding:30px 22px 24px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.8)}
.call .ph{width:120px;height:144px;border-radius:50%/42%;overflow:hidden;margin:0 auto 12px;border:3px solid #2f3a52}
.call .ph svg{width:100%;display:block}
.call h3{margin:0;font-size:22px}
.call .st{color:#8ab4ff;margin:4px 0 18px;font-size:14px}
.call .ring{animation:ring 1.2s infinite}
@keyframes ring{0%,100%{transform:rotate(0)}10%,30%{transform:rotate(-8deg)}20%,40%{transform:rotate(8deg)}50%{transform:rotate(0)}}
.cbtn{width:66px;height:66px;border-radius:50%;border:0;font-size:28px;color:#fff;margin:0 14px}
.cbtn.ok{background:#2fb35a}.cbtn.no{background:#e04a4a}
.calllog{text-align:left;max-height:330px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.inbox .msg{display:flex;gap:10px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}
.inbox .msg:hover{background:#151b27}
.inbox .av{width:44px;height:52px;border-radius:8px;overflow:hidden;flex:none}
.inbox .av svg{width:100%;height:100%}
.toast{position:fixed;right:22px;bottom:22px;background:#1a2131;border:1px solid #3a4660;border-left:4px solid var(--gold);color:#fff;padding:12px 18px;border-radius:10px;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:420px;animation:fade .2s;font-size:14.5px}
.toast.ev{border-left-color:var(--green)}
.toast.err{border-left-color:var(--red)}
textarea.notes{width:100%;min-height:200px;background:#0f141d;border:1px solid #2c3550;border-radius:10px;color:#fff;padding:12px;resize:vertical;line-height:1.5}
.jr{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45}
.jr .t{color:var(--mut);font-size:12.5px;width:60px;flex:none;padding-top:2px}
.quiz label{display:block;padding:10px 14px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer;background:var(--panel2)}
.quiz label:hover{border-color:#3a4660}
.quiz input{margin-right:10px}
.score{font-size:56px;font-family:Georgia,serif;color:var(--gold);text-align:center;margin:6px 0}

/* ===== телефон / планшет ===== */
@media (hover:none){.bub .pin{display:block}}
@media (max-width:860px){
  html,body{font-size:14.5px}
  .desk{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .main{order:1;min-height:0}
  .side{order:2;flex-direction:row;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;border-right:0;border-top:1px solid var(--line)}
  .side .brand,.side .sp{display:none}
  .nav{flex-direction:column;gap:2px;padding:6px 8px;font-size:10.5px;min-width:64px;align-items:center;text-align:center}
  .nav .ic{font-size:20px;width:auto}
  .nav .bd{position:absolute;top:2px;right:6px;margin:0;font-size:10px;padding:0 5px}
  .myphone{flex-direction:column;gap:2px;padding:6px 8px;min-width:64px;font-size:10.5px;border-radius:9px}
  .myphone div{display:none}
  .myphone #bd_inbox{position:absolute;margin-left:28px;margin-top:-6px}
  .topbar{padding:8px 12px;gap:8px;min-height:48px;flex-wrap:wrap}
  .topbar h1{font-size:17px}
  .topbar .chip:first-of-type{display:none}
  #callG{font-size:12px;padding:5px 8px}
  .pending{width:100%;overflow-x:auto}
  .content{padding:14px 12px 20px}
  .two{display:block!important}
  .two>*+*{margin-top:16px}
  .h2{font-size:21px}
  .paper{padding:18px}
  .paper p{font-size:15px}
  .grid{grid-template-columns:1fr!important}
  .dossier{grid-template-columns:1fr}
  .dossier .ph{width:150px}
  .dossier td:first-child{width:110px}
  .scene .art{height:130px;padding:14px 16px}
  .scene .art .em{font-size:56px;right:16px}
  .scene .art h2{font-size:22px}
  .scene .body{padding:14px}
  .phonewrap{gap:14px}
  .phone{width:100%;max-width:380px;height:72vh;border-radius:30px;border-width:7px}
  .side-info{min-width:0}
  .bank table{font-size:12.5px}
  .bank td,.bank th{padding:7px 4px}
  .talk{grid-template-columns:1fr;grid-template-rows:auto 1fr;width:100vw;height:100%;border-radius:0}
  .talk .who{flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;gap:8px;border-right:0;border-bottom:1px solid var(--line)}
  .talk .who .ph{width:58px;flex:none}
  .talk .who h3{font-size:16px}
  .talk .who>div[style*="flex:1"]{display:none}
  .talk .who .btn{padding:7px 10px;font-size:13px}
  .talk .log{padding:12px}
  .ln{max-width:94%;font-size:14.5px}
  .topics{max-height:38%;padding:10px}
  .topic{font-size:13px;padding:7px 10px}
  .modal{padding:18px;border-radius:12px}
  .call{width:92vw}
  .toast{left:12px;right:12px;bottom:84px!important;max-width:none}
  .logo{font-size:44px;letter-spacing:5px}
  .logoimg{width:84px;height:84px}
  .title{justify-content:flex-start;padding-top:40px;overflow:auto}

  // ---------- звук ----------
  let AC = null;
  function snd(k) {
    if (!SAVE.settings.sound) return;
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      const t = AC.currentTime;
      const tone = (f, d, type, v, at) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'sine'; o.frequency.value = f; g.gain.setValueAtTime(v || .12, t + (at || 0)); g.gain.exponentialRampToValueAtTime(.0001, t + (at || 0) + d); o.connect(g); g.connect(AC.destination); o.start(t + (at || 0)); o.stop(t + (at || 0) + d + .05); };
      if (k === 'msg') { tone(880, .12, 'sine', .1); tone(1320, .15, 'sine', .08, .1); }
      else if (k === 'ev') { tone(523, .12, 'triangle', .12); tone(784, .2, 'triangle', .12, .1); }
      else if (k === 'ring') { for (let i = 0; i < 3; i++) { tone(660, .25, 'sine', .1, i * .5); tone(880, .25, 'sine', .08, i * .5 + .25); } }
      else if (k === 'lie') { tone(220, .25, 'sawtooth', .08); tone(330, .3, 'square', .06, .15); }
      else if (k === 'err') tone(160, .25, 'sawtooth', .08);
      else if (k === 'click') tone(700, .04, 'square', .03);
      else if (k === 'win') [523, 659, 784, 1046].forEach((f, i) => tone(f, .4, 'triangle', .12, i * .14));
    } catch (e) { /* без звука */ }
  }

  // ---------- состояние дела ----------
  let C = null, S = null;
  function newState(c) {
    return { flags: {}, ev: [], evNew: {}, labs: {}, bankReq: {}, tech: {}, wire: {}, queue: [], fired: {}, inbox: [], journal: [], tlog: {}, lies: {}, presented: {}, spots: {}, notes: '', play: 0, view: 'case', pplNew: {}, pins: {}, accused: null, started: Date.now() };
  }
  function openCase(id, fresh) {
    C = CASES.find(c => c.id === id);

    if (fresh || !SAVE.cases[id]) {
      SAVE.cases[id] = newState(C); SAVE.cases[id].gen = C.gen || 0;
      S = SAVE.cases[id];
      C.start.forEach(f => { if (C.evidence[f]) give(f, true); else setFlag(f, true); });
      checkTriggers();
      persist();
    }
    S = SAVE.cases[id];
    renderDesk();
    startTick();
  }

  const has = f => !!S.flags[f];
  function req(r) {
    if (!r) return true;
    for (const x of r) {
      if (Array.isArray(x)) { if (!x.some(y => typeof y === 'string' ? chk(y) : req([y]))) return false; }
      else if (!chk(x)) return false;
    }
    return true;
  }
  function chk(f) { return f[0] === '!' ? !has(f.slice(1)) : has(f); }
  function setFlag(f, silent) {
    if (S.flags[f]) return;
    S.flags[f] = 1;
    if (f.startsWith('k_')) { const pid = f.slice(2); if (C.people[pid] && !silent) { S.pplNew[pid] = 1; toast(`👤 Новое лицо в деле: ${C.people[pid].name}`); } else if (C.people[pid]) S.pplNew[pid] = 1; }
    if (!silent) { checkTriggers(); persist(); }
  }
  function setFlags(a) { (a || []).forEach(f => setFlag(f)); }
  function give(id, silent) {
    if (S.ev.includes(id)) return false;
    const e = C.evidence[id]; if (!e) return false;
    S.ev.push(id); S.evNew[id] = 1; S.flags[id] = 1;
    journal(`Улика: ${e.name}`);
    if (!silent) { snd('ev'); toast(`${e.icon} Новая улика: <b>${esc(e.name)}</b>`, 'ev'); checkTriggers(); persist(); updateBadges(); }
    return true;
  }
  function journal(text) { S.journal.push({ t: clock(), text }); }
  function clock(off) {
    const sec = 9 * 3600 + (S ? S.play : 0) * 10 + (off || 0);
    const h = Math.floor(sec / 3600) % 24, m = Math.floor(sec / 60) % 60;
    return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  }

  // ---------- триггеры и очередь ----------
  function checkTriggers() {
    C.messages.forEach(m => {

      if (due.length) {
        S.queue = S.queue.filter(q => q.due > S.play);
        due.forEach(processQ);
        persist();
      }
      const cl = $('#clock'); if (cl) cl.textContent = clock();
      if (S.play % 15 === 0) persist();

      renderPending();
    }, 1000);
  }
  function processQ(q) {
    if (q.type === 'msg') {
      const m = C.messages.find(x => x.id === q.id);

    } else if (q.type === 'lab') {
      const e = C.evidence[q.id];
      S.labs[q.id].done = true;
      setFlags(e.lab.set);
      if (e.lab.note) journal(e.lab.note);
      S.inbox.unshift({ id: 'lab_' + q.id, from: 'vera', time: clock(), read: false, text: `Готово заключение по «${e.name}». ${e.lab.text}` });

    } else if (q.type === 'tech') {

      journal(`Техотдел разблокировал: ${ph.title}`);

      snd('msg'); toast('🎧 Новые записи прослушки');
    }
    checkTriggers();
    updateBadges();
    if (['lab', 'bank', 'tech', 'wire'].includes(q.type)) refreshIf(q.type === 'lab' ? 'evidence' : q.type === 'bank' ? 'bank' : q.type === 'tech' ? 'phones' : 'wire');

  function canTalk(pid) {
    if (C.people[pid].victim) return false;

    delete S.pplNew[pid];

    const detained = Object.values(C.actions).some(a => a.person === pid && a.done && has(a.done[0]));
    const bk = Object.keys(C.bank).filter(k => C.bank[k].owner === pid);

    el.innerHTML = `<div class="fade"><button class="btn sm" id="back">← Назад</button>

      <h2 class="h2">${esc(p.name)}</h2><div style="color:var(--mut);margin-bottom:6px">${esc(p.role)}${p.age ? ', ' + p.age + ' лет' : ''}</div><div style="margin-bottom:10px">${statusTags(pid)}</div>

  function personNotes(pid) {
    const log = S.tlog[pid];
    if (!log || !log.length) return '';
    return `<div class="card" style="margin-top:16px"><b>🗒️ Протокол разговора</b><div style="margin-top:10px;max-height:320px;overflow:auto;font-size:14px;line-height:1.55">${log.map(([c, t]) => `<div style="padding:3px 0;${c === 'me' ? 'color:#9ec0ff' : c === 'n' ? 'color:var(--mut);font-style:italic' : c === 'lie' ? 'color:#ff9a90;font-weight:700' : c === 'ev' ? 'color:#f0d08a' : ''}">${c === 'me' ? 'Вы: ' : ''}${esc(t)}</div>`).join('')}</div></div>`;
  }
  function dbTable(d) {
    const rows = [['Дата рождения', d.dob], ['Адрес', d.addr], ['Место работы', d.work], ['Телефон', d.phone], ['Семья', d.family], ['Судимости', d.record], ['Транспорт', d.car], ['Счета', d.acc]];

  }
  function suspects() { return C.accuse.questions[0].opts.map(o => o[0]); }
  function requestDetain(pid) {
    const p = C.people[pid];
    let picks = [];
    const ov = overlay('<div class="modal" id="dm" style="width:min(900px,94vw)"></div>');
    const draw = () => {
      const m = $('#dm');
      m.innerHTML = `<div class="tag red">ЗАПРОС НА ЗАДЕРЖАНИЕ</div><h2 style="margin-top:8px">${esc(p.name)}</h2>
        <p class="hint" style="line-height:1.55">Громов подпишет задержание, только если улики докажут две вещи: <b>1)</b> человек связывался с жертвой незадолго до преступления; <b>2)</b> он был на месте или лжёт о том, где был. Выберите до 4 улик. Каждый необоснованный запрос снижает итоговую оценку.</p>
        <div class="picker">${S.ev.map(id => `<div class="ev ${picks.includes(id) ? 'sel' : ''}" data-e="${id}"><div class="i">${C.evidence[id].icon}</div><div><b>${esc(C.evidence[id].name)}</b><small>${esc(C.evidence[id].desc)}</small></div></div>`).join('')}</div>
        <div class="row"><span class="hint" style="margin-right:auto">Выбрано: ${picks.length}/4${S.badDetain ? ` · отклонённых запросов: ${S.badDetain}` : ''}</span><button class="btn" id="dc">Отмена</button><button class="btn red" id="dg">🚔 Отправить Громову</button></div>`;
      m.querySelectorAll('[data-e]').forEach(d => d.onclick = () => { const id = d.dataset.e; if (picks.includes(id)) picks = picks.filter(x => x !== id); else if (picks.length < 4) picks.push(id); draw(); });
      m.querySelector('#dc').onclick = closeOv;
      m.querySelector('#dg').onclick = () => {
        if (!picks.length) { toast('Выберите улики-основания', 'err'); return; }
        const a = Object.values(C.actions).find(x => x.person === pid);
        const ok = a && req(a.req) && (a.grounds || []).every(g => g.some(e => picks.includes(e)));
        closeOv();
        if (!ok) {
          S.badDetain = (S.badDetain || 0) + 1; persist(); snd('err');
          journal(`Громов отклонил запрос на задержание: ${p.name}.`);
          popup(`<div style="display:flex;gap:14px;align-items:center"><div style="width:64px;flex:none;border-radius:8px;overflow:hidden">${pt('gromov')}</div><h2 style="margin:0">Громов: «Не подпишу»</h2></div><p style="line-height:1.6;margin-top:12px">«Не убедил. Из твоих бумаг не следует, что ${esc(p.name)} связывал${p.f ? 'ась' : 'ся'} с жертвой перед преступлением и ${p.f ? 'была' : 'был'} на месте. Либо улик не хватает, либо ты ищешь не там. Докопайся до правды — потом приходи».</p>`);
          return;
        }
        setFlags(a.done); (a.give || []).forEach(g => give(g));
        if (a.note) journal(a.note);
        snd('win'); toast(`🚔 Громов подписал задержание: ${esc(p.name)}`, 'ev'); persist();
        openPerson(pid);
      };
    };
    draw();
  }

    el.innerHTML = `<div class="fade"><h2 class="h2">База данных МВД</h2><p class="hint">Поиск по фамилии, имени или номеру телефона. Найденные люди попадают в дело.</p>
      <div class="dbhead">ИЦ ГУ МВД · ТУМАНСК · доступ: следователь · сеанс ${clock()}</div>
      <div class="search"><input id="q" placeholder="Например: Лебедев или 913 402" autofocus><button class="btn gold" id="go">Найти</button></div><div id="res"></div></div>`;
    const go = () => {
      const q = $('#q').value.trim().toLowerCase();
      const res = $('#res');
      if (q.length < 3) { res.innerHTML = '<p class="hint">Введите хотя бы 3 символа.</p>'; return; }
      const dq = q.replace(/\D/g, '');
      const found = Object.keys(C.people).filter(pid => {
        const p = C.people[pid]; if (p.colleague || !p.db) return false;
        const words = p.name.toLowerCase().replace(/ё/g, 'е').split(/\s+/);
        const qq = q.replace(/ё/g, 'е');
        if (words.some(w => w.length >= 3 && (w === qq || w.startsWith(qq) && qq.length >= 4))) return true;
        if (p.name.toLowerCase().replace(/ё/g, 'е') === qq) return true;
        if (dq.length >= 6 && p.db.phone.replace(/\D/g, '').includes(dq)) return true;
        return false;
      });
      if (!found.length) { res.innerHTML = '<div class="card">По запросу ничего не найдено.</div>'; snd('err'); return; }
      found.forEach(f => setFlag('k_' + f));
      res.innerHTML = `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(270px,1fr))">${found.map(personChip).join('')}</div>`;
      bindPersonChips(res);
      updateBadges();
    };
    $('#go').onclick = go; $('#q').onkeydown = e => { if (e.key === 'Enter') go(); };
  }

      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin-bottom:20px">${keys.map(k => { const b = C.bank[k], R = S.bankReq[k]; return `<div class="card click" data-b="${k}" style="${BK === k ? 'border-color:var(--gold)' : ''}"><b>${esc(C.people[b.owner].name)}</b><div class="hint" style="margin:4px 0 8px">${esc(b.acc)}</div>${R ? (R.done ? `<span class="tag green">выписка получена</span>${!R.seen ? '<span class="newdot"></span>' : ''}` : '<span class="tag blue">запрос в банке…</span>') : '<span class="tag gold">запросить</span>'}</div>`; }).join('')}</div><div id="stm"></div></div>`;
    el.querySelectorAll('[data-b]').forEach(d => d.onclick = () => {
      const k = d.dataset.b, b = C.bank[k];

        S.bankReq[k] = { done: false }; S.queue.push({ due: S.play + b.delay, type: 'bank', id: k }); persist(); toast('🏦 Запрос отправлен в банк'); renderPending(); vBank(el); return;
      }

        <table><tr><th>Дата и время</th><th>Описание</th><th style="text-align:right">Сумма</th><th></th></tr>${b.tx.map(t => `<tr class="${t[3] && S.ev.includes(t[3]) ? 'hl' : ''}"><td style="white-space:nowrap;color:var(--mut)">${esc(t[0])}</td><td>${esc(t[2])}${t[4] ? (has('k_' + t[4]) ? ` <span class="tag blue">👤 ${esc(C.people[t[4]].name)}</span>` : ` <button class="btn sm" data-own="${t[4]}">👤 Установить владельца</button>`) : ''}</td><td class="${t[1] > 0 ? 'plus' : 'minus'}">${t[1] > 0 ? '+' : '−'}${Math.abs(t[1]).toLocaleString('ru-RU')} ₽</td><td style="width:44px">${t[3] ? `<button class="btn sm" data-pin="${t[3]}">${S.ev.includes(t[3]) ? '✓' : '📌'}</button>` : ''}</td></tr>`).join('')}</table></div>`;

      $('#stm').querySelectorAll('[data-own]').forEach(x => x.onclick = () => { const pid = x.dataset.own; setFlag('k_' + pid); journal(`Установлен владелец счёта: ${C.people[pid].name}`); vBank(el); });

          <div class="tr">${c.lines.map(([w2, t]) => w2 === '*' ? `<div class="n">${esc(t)}</div>` : `<div><b>${esc(w2)}:</b> ${esc(t)}</div>`).join('')}</div>
          <div style="margin-top:10px"><button class="btn sm" data-pin="${c.ev}">${S.ev.includes(c.ev) ? '✓ В уликах' : '📌 Добавить запись в улики'}</button></div></div>`).join('') : ''}</div>`; }).join('')}</div>`;
    keys.forEach(k => { if (S.wire[k] && S.wire[k].done) S.wire[k].seen = true; });
    el.querySelectorAll('[data-w]').forEach(b => b.onclick = () => {

      S.wire[b.dataset.w] = { done: false }; S.queue.push({ due: S.play + w.delay, type: 'wire', id: b.dataset.w }); persist(); toast('⚖️ Санкция получена, номер на прослушке'); vWire(el); renderPending();

  // ---------- ЖУРНАЛ ----------
  function vJournal(el) {
    el.innerHTML = `<div class="fade two" style="display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start">
      <div class="card"><b>📓 Журнал расследования</b><div style="margin-top:8px">${S.journal.slice().reverse().map(j => `<div class="jr"><span class="t">${esc(j.t)}</span><span>${esc(j.text)}</span></div>`).join('')}</div></div>
      <div class="card"><b>✏️ Мои заметки</b><p class="hint" style="margin:6px 0 10px">Пишите версии и догадки. Сохраняется автоматически.</p><textarea class="notes" id="nt" placeholder="Например: у кого был код сейфа?..">${esc(S.notes)}</textarea></div></div>`;
    $('#nt').oninput = e => { S.notes = e.target.value; persist(); };
  }

  // ---------- РАЗГОВОР ----------
  let TK = null;
  function openTalk(pid) {
    const p = C.people[pid], T = C.talk[pid];
    if (!T) return;
    setFlag('k_' + pid);
    TK = pid;
    const ov = overlay(`<div class="talk"><div class="who"><div class="ph">${pt(pid)}</div><h3>${esc(p.name)}</h3><div style="color:var(--mut);font-size:14px">${esc(p.role)}</div><div>${statusTags(pid)}</div><div style="flex:1"></div>
      <button class="btn gold" id="pres">📂 Предъявить улику</button><button class="btn" id="bye">Завершить разговор</button></div>
      <div class="r"><div class="log" id="log"></div><div class="topics" id="tops"></div></div></div>`);
    const log = $('#log');
    if (!S.tlog[pid]) {
      S.tlog[pid] = [];
      const intro = (T.detainFlag && has(T.detainFlag) && T.introDetained) ? T.introDetained : T.intro;
      addLines(pid, intro, false);
    } else if (T.detainFlag && has(T.detainFlag) && T.introDetained && !S['intro2_' + pid]) {
      S['intro2_' + pid] = 1; addLines(pid, T.introDetained, false);
    }
    S.tlog[pid].forEach(([c, t]) => log.appendChild(lineEl(c, t, pid)));
    log.scrollTop = log.scrollHeight;
    drawTopics(pid);
    $('#bye').onclick = () => { closeOv(); TK = null; persist(); if (S.view === 'people' || S.view === 'case' || S.view === 'map') renderView(); updateBadges(); };
    $('#pres').onclick = () => pickEvidence(pid);
  }
  function lineEl(c, t, pid) {
    const d = document.createElement('div');
    d.className = 'ln ' + c;
    d.innerHTML = c === 'p' ? `<b style="color:var(--gold);font-size:12.5px;display:block">${esc(C.people[pid].name.split(' ')[0])}</b>${esc(t)}` : esc(t);
    return d;
  }
  function parseLine(s) {
    if (s.startsWith('> ')) return ['me', s.slice(2)];
    if (s.startsWith('* ')) return ['n', s.slice(2)];
    return ['p', s];
  }
  function addLines(pid, lines, animate) {
    const log = $('#log');
    const parsed = lines.map(parseLine);
    parsed.forEach(l => S.tlog[pid].push(l));
    if (!log) return;
    if (!animate) return;
    let i = 0;
    const lock = $('#tops'); if (lock) lock.style.pointerEvents = 'none';
    (function next() {
      if (i >= parsed.length) { if (lock) lock.style.pointerEvents = ''; drawTopics(pid); return; }
      log.appendChild(lineEl(parsed[i][0], parsed[i][1], pid)); log.scrollTop = log.scrollHeight;
      i++; setTimeout(next, parsed[i - 1][0] === 'me' ? 250 : 520);
    })();
  }
  function drawTopics(pid) {
    const T = C.talk[pid], el = $('#tops'); if (!el) return;
    const tops = T.topics.filter(t => req(t.req));
    el.innerHTML = tops.map(t => `<button class="topic ${has('t_' + pid + '_' + t.id) ? 'done' : 'new'}" data-t="${t.id}">${has('t_' + pid + '_' + t.id) ? '✓ ' : '❓ '}${esc(t.q)}</button>`).join('') || '<span class="hint">Больше вопросов нет. Попробуйте предъявить улику.</span>';
    el.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
      const t = T.topics.find(x => x.id === b.dataset.t);
      const first = !has('t_' + pid + '_' + t.id);
      snd('click');
      addLines(pid, ['> ' + t.q].concat(t.lines), true);
      if (first) {
        setFlag('t_' + pid + '_' + t.id);
        setFlags(t.set); (t.give || []).forEach(g => give(g));
        if (t.note) journal(t.note);
      }
      persist();
    });
  }
  function pickEvidence(pid) {
    const box = document.createElement('div'); box.className = 'ov'; box.style.zIndex = 60;
    box.innerHTML = `<div class="modal" style="width:min(900px,94vw)"><h2>Что предъявить?</h2><p class="hint">Выберите улику. Ищите противоречия в показаниях.</p><div class="picker">${S.ev.map(id => `<div class="ev" data-e="${id}"><div class="i">${C.evidence[id].icon}</div><div><b>${esc(C.evidence[id].name)}</b><small>${esc(C.evidence[id].desc)}</small></div></div>`).join('')}</div><div class="row"><button class="btn" id="cx">Отмена</button></div></div>`;
    document.body.appendChild(box);
    box.querySelector('#cx').onclick = () => box.remove();
    box.querySelectorAll('[data-e]').forEach(d => d.onclick = () => { box.remove(); present(pid, d.dataset.e); });
  }
  const GENERIC = ['Не понимаю, к чему вы это.', 'И что это должно значить?', 'Мне нечего об этом сказать.', 'Впервые вижу. Это как-то связано со мной?', '* Человек пожимает плечами.'];
  function present(pid, evId) {
    const T = C.talk[pid];
    const e = C.evidence[evId];
    let resp = null;
    (T.presentFlags || []).forEach(pf => { if (!resp && pf.ev === evId && req(pf.req)) resp = pf; });
    if (!resp && T.present && T.present[evId]) {
      const r = T.present[evId];
      const o = Array.isArray(r) ? { lines: r } : r;
      if (o && req(o.req)) resp = o;
    }
    S.tlog[pid].push(['ev', `📂 Вы предъявляете: ${e.name}`]);
    $('#log').appendChild(lineEl('ev', `📂 Вы предъявляете: ${e.name}`, pid));
    if (!resp) { addLines(pid, [GENERIC[(evId.length + pid.length) % GENERIC.length]], true); persist(); return; }
    const key = pid + ':' + evId;
    const first = !S.presented[key];
    S.presented[key] = 1;
    addLines(pid, resp.lines, true);
    if (resp.lie && !S.lies[key]) {
      S.lies[key] = 1;
      setTimeout(() => { S.tlog[pid].push(['lie', '⚠ ЛОЖЬ РАСКРЫТА']); const l = $('#log'); if (l) { l.appendChild(lineEl('lie', '⚠ ЛОЖЬ РАСКРЫТА', pid)); l.scrollTop = l.scrollHeight; } snd('lie'); }, resp.lines.length * 520 + 200);
    }
    if (first) { setFlags(resp.set); (resp.give || []).forEach(g => give(g)); if (resp.note) journal(resp.note); }
    persist();
  }

  // ---------- МОЙ ТЕЛЕФОН ----------
  let callQueue = [];
  function tryCall() {
    if (!callQueue.length || $('.ov')) return;
    const m = callQueue.shift();
    incomingCall(m);
  }
  function incomingCall(m) {
    snd('ring');
    const p = C.people[m.from];
    const ov = overlay(`<div class="call"><div class="ph ring">${pt(m.from)}</div><h3>${esc(p.name)}</h3><div class="st">Входящий звонок…</div><div id="cl" class="calllog"></div><div id="cb"><button class="cbtn no" id="dec">✕</button><button class="cbtn ok" id="acc">📞</button></div></div>`);
    const accept = () => {
      m.read = true;
      $('.call .ph').classList.remove('ring');
      $('.call .st').textContent = 'Идёт разговор';
      $('#cb').innerHTML = '';
      const cl = $('#cl'); let i = 0;
      (function next() {
        if (i >= m.lines.length) { $('#cb').innerHTML = '<button class="cbtn no" id="end">✕</button>'; $('#end').onclick = () => { closeOv(); updateBadges(); }; return; }
        const [w, t] = m.lines[i];
        const d = document.createElement('div'); d.className = 'ln ' + (w === '>' ? 'me' : 'p'); d.style.maxWidth = '100%'; d.style.fontSize = '14px';
        d.innerHTML = w === '>' ? esc(t) : `<b style="color:var(--gold);font-size:12px;display:block">${esc(w)}</b>${esc(t)}`;
        cl.appendChild(d); cl.scrollTop = cl.scrollHeight; i++;
        setTimeout(next, 900);
      })();
    };
    $('#acc').onclick = accept;
    $('#dec').onclick = () => { closeOv(); toast('Пропущенный звонок. Его можно прослушать в «Моём телефоне».'); updateBadges(); };
  }
  function openInbox() {
    const ov = overlay(`<div class="modal inbox" style="width:min(620px,94vw);padding:0"><div style="padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center"><h2 style="margin:0">📲 Мой телефон</h2><div style="flex:1"></div><button class="btn sm" id="x">Закрыть</button></div>
      <div>${S.inbox.length ? S.inbox.map((m, i) => `<div class="msg" data-i="${i}"><div class="av">${pt(m.from)}</div><div style="flex:1;min-width:0"><b>${esc(C.people[m.from].name)}</b> ${m.read ? '' : '<span class="newdot"></span>'}<span style="float:right;color:var(--mut);font-size:12px">${m.call ? '📞 ' : ''}${esc(m.time)}</span><div style="color:#c8cfdc;font-size:14px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.text || (m.lines && m.lines[0][1]) || '')}</div></div></div>`).join('') : '<p class="hint" style="padding:20px">Сообщений нет.</p>'}</div></div>`);
    $('#x').onclick = () => { closeOv(); updateBadges(); };
    ov.querySelectorAll('[data-i]').forEach(d => d.onclick = () => {
      const m = S.inbox[+d.dataset.i]; m.read = true; persist();
      const body = m.lines ? m.lines.map(([w, t]) => `<div class="ln ${w === '>' ? 'me' : 'p'}" style="max-width:100%;margin:6px 0">${w === '>' ? '' : `<b style="color:var(--gold);font-size:12px;display:block">${esc(w)}</b>`}${esc(t)}</div>`).join('') : `<div class="ln p" style="max-width:100%">${esc(m.text)}</div>`;
      popup(`<h2>${m.call ? '📞 Звонок' : '💬 Сообщение'}: ${esc(C.people[m.from].name)}</h2><div style="color:var(--mut);margin-bottom:10px">${esc(m.time)}</div>${body}`, null, openInbox);
    });
  }
  function callGromov() {
    const t = C.tasks.find(x => req(x.req) && !req(x.done));
    const line = t ? `Что дальше? По-моему, сейчас главное: ${t.text.charAt(0).toLowerCase() + t.text.slice(1)}.` : 'Всё, что нужно, у тебя есть. Предъявляй обвинение.';
    incomingCallOut([['Громов', 'Слушаю.'], ['>', 'Комиссар, нужен совет.'], ['Громов', line], ['Громов', 'И помни: в этом городе все говорят правду. Ищи, где правда не сходится с фактами.']]);
  }
  function incomingCallOut(lines) {
    overlay(`<div class="call"><div class="ph">${pt('gromov')}</div><h3>Комиссар Громов</h3><div class="st">Исходящий звонок</div><div id="cl" class="calllog"></div><div id="cb"></div></div>`);

      const [w, t] = lines[i];

      d.innerHTML = w === '>' ? esc(t) : `<b style="color:var(--gold);font-size:12px;display:block">${esc(w)}</b>${esc(t)}`;
      cl.appendChild(d); i++; setTimeout(next, 800);
    })();
  }

  // ---------- ОБВИНЕНИЕ ----------
  function openAccuse() {
    const A = C.accuse;
    const ans = {}; let picks = [];
    let step = 0;
    const ov = overlay('<div class="modal" id="acc" style="width:min(860px,94vw)"></div>');
    const draw = () => {
      const m = $('#acc');
      if (step < A.questions.length) {
        const q = A.questions[step];
        m.innerHTML = `<div class="tag red">ОБВИНИТЕЛЬНОЕ ЗАКЛЮЧЕНИЕ · ${step + 1}/${A.questions.length + 1}</div><h2 style="margin-top:8px">${esc(q.q)}</h2><div class="quiz">${q.opts.map(([k, l]) => `<label><input type="radio" name="q" value="${k}" ${ans[step] === k ? 'checked' : ''}>${esc(l)}</label>`).join('')}</div>
          <div class="row"><button class="btn" id="cx">Отмена</button>${step ? '<button class="btn" id="pv">← Назад</button>' : ''}<button class="btn gold" id="nx">Далее →</button></div>`;
        m.querySelector('#nx').onclick = () => { const v = m.querySelector('input:checked'); if (!v) { toast('Выберите ответ', 'err'); return; } ans[step] = v.value; step++; draw(); };
      } else {
        m.innerHTML = `<div class="tag red">ОБВИНИТЕЛЬНОЕ ЗАКЛЮЧЕНИЕ · ${step + 1}/${A.questions.length + 1}</div><h2 style="margin-top:8px">Какие улики вы передадите в суд?</h2><p class="hint">Выберите до 4 самых сильных доказательств. Суд оценит каждую.</p>
          <div class="picker">${S.ev.map(id => `<div class="ev ${picks.includes(id) ? 'sel' : ''}" data-e="${id}"><div class="i">${C.evidence[id].icon}</div><div><b>${esc(C.evidence[id].name)}</b><small>${esc(C.evidence[id].desc)}</small></div></div>`).join('')}</div>
          <div class="row"><span class="hint" style="margin-right:auto">Выбрано: ${picks.length}/4</span><button class="btn" id="pv">← Назад</button><button class="btn red" id="go">⚖️ Передать дело в суд</button></div>`;
        m.querySelectorAll('[data-e]').forEach(d => d.onclick = () => { const id = d.dataset.e; if (picks.includes(id)) picks = picks.filter(x => x !== id); else if (picks.length < 4) picks.push(id); draw(); });
        m.querySelector('#go').onclick = () => { if (!picks.length) { toast('Выберите хотя бы одну улику', 'err'); return; } judge(ans, picks); };
      }
      const cx = m.querySelector('#cx'); if (cx) cx.onclick = closeOv;
      const pv = m.querySelector('#pv'); if (pv) pv.onclick = () => { step--; draw(); };
    };
    draw();
  }
  function judge(ans, picks) {
    const A = C.accuse;
    let score = 0; const lines = [];
    A.questions.forEach((q, i) => { const ok = ans[i] === q.correct; if (ok) score += q.w; lines.push([ok, q.q, q.opts.find(o => o[0] === ans[i])[1]]); });
    const good = picks.filter(p => A.keyEvidence.includes(p));
    score += good.length * 5;
    const bonus = Object.keys(A.bonusFlags).filter(f => has(f));
    const lies = Object.keys(S.lies).length;
    const killerOk = ans[0] === A.questions[0].correct;
    score -= Math.min(20, (S.badDetain || 0) * 5);
    score = Math.max(0, score);
    if (!killerOk) score = Math.min(score, 30);
    score = Math.min(100, score);
    let rank = score >= 95 ? 'Легенда Туманска' : score >= 80 ? 'Старший следователь' : score >= 60 ? 'Следователь' : 'Стажёр';
    S.accused = { score, rank, lines, picks, good: good.length, bonus, lies, killerOk, time: S.play, badDetain: S.badDetain || 0 };
    if (killerOk) { setFlag('case_closed'); snd('win'); } else snd('err');
    persist();
    closeOv();
    showVerdict();
  }
  function showVerdict() {
    const R = S.accused, A = C.accuse;
    overlay(`<div class="modal" style="width:min(820px,94vw)"><div class="tag ${R.killerOk ? 'green' : 'red'}">${R.killerOk ? 'ВИНОВЕН · ПРИГОВОР ВЫНЕСЕН' : 'ДЕЛО РАЗВАЛИЛОСЬ В СУДЕ'}</div>
      <div class="score">${R.score}<span style="font-size:24px;color:var(--mut)">/100</span></div><h2 style="text-align:center">${esc(R.rank)}</h2>
      <div class="card" style="margin:14px 0">${R.lines.map(([ok, q, a]) => `<div style="padding:5px 0">${ok ? '✅' : '❌'} <b>${esc(q)}</b><br><span style="color:var(--mut)">${esc(a)}</span></div>`).join('')}
        <div style="padding:5px 0">📂 Сильных улик передано в суд: <b>${R.good}/${R.picks.length}</b></div><div style="padding:5px 0">⚠ Раскрыто ложных показаний: <b>${R.lies}</b></div>
        <div style="padding:5px 0">🚔 Отклонённых запросов на задержание: <b>${R.badDetain || 0}</b>${R.badDetain ? ` (−${Math.min(20, R.badDetain * 5)} баллов)` : ''}</div>
        <div style="padding:5px 0">⏱ Время расследования: <b>${Math.floor(R.time / 60)} мин</b></div>
        ${R.bonus.length ? `<div style="margin-top:6px">${R.bonus.map(f => `<span class="tag gold">🏅 ${esc(A.bonusFlags[f])}</span>`).join('')}</div>` : ''}</div>
      ${R.killerOk ? A.epilogue.map(p => `<p style="font-family:Georgia;line-height:1.6;font-size:15.5px">${esc(p)}</p>`).join('') : '<p style="font-family:Georgia;line-height:1.6">Адвокаты разнесли обвинение в пух и прах. Настоящий убийца на свободе. Громов молча забирает папку: «Пересмотри всё ещё раз».</p>'}
      <div class="row">${R.killerOk ? '' : '<button class="btn gold" id="retry">Пересмотреть дело</button>'}<button class="btn" id="cl">Закрыть</button></div></div>`);
    $('#cl').onclick = () => { closeOv(); renderView(); };
    const rt = $('#retry'); if (rt) rt.onclick = () => { S.accused = null; persist(); closeOv(); renderView(); };
  }

  // ---------- оверлеи ----------
  function overlay(html) {
    closeOv();
    const d = document.createElement('div'); d.className = 'ov'; d.innerHTML = html;
    document.body.appendChild(d);
    return d;
  }
  function closeOv() { document.querySelectorAll('.ov').forEach(o => o.remove()); }
  function popup(html, onMount, onClose) {
    const d = overlay(`<div class="modal">${html}<div class="row"><button class="btn" id="pc">Закрыть</button></div></div>`);
    $('#pc').onclick = () => { closeOv(); if (onClose) onClose(); };
    if (onMount) onMount(d.querySelector('.modal'));
    return d;
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('.ov') && !$('.talk') && !$('.call')) closeOv(); });

  // ---------- главное меню ----------
  async function quitGame() {
    if (!NATIVE) return;
    try { if (USER && STORE.profiles[USER]) STORE.profiles[USER].save = SAVE; await fetch('/api/save', { method: 'POST', body: JSON.stringify(STORE) }); } catch (e) { /* ignore */ }
    app.innerHTML = '<div class="title fade"><div class="logoimg">' + BADGE_SVG + '</div><p class="hint">Прогресс сохранён. До встречи, детектив!</p></div>';
    try { await fetch('/api/quit'); } catch (e) { /* ignore */ }
    setTimeout(() => window.close(), 400);
  }
  function askQuit() {
    popup('<h2>Выйти из игры?</h2><p>Прогресс сохранится автоматически.</p>', m => {
      const r = m.querySelector('.row');
      r.insertAdjacentHTML('afterbegin', '<button class="btn red" id="qy">⏻ Выйти</button>');
      m.querySelector('#qy').onclick = () => { closeOv(); quitGame(); };
      m.querySelector('#pc').textContent = 'Отмена';
    });
  }
  let FILT = 'all';
  function screenTitle() {
    if (S) armBack();
    S = null; C = null; clearInterval(tickT);
    app.innerHTML = `<div class="title fade"><div class="logoimg">${BADGE_SVG}</div><h1 class="logo">HOME POLICE</h1><div class="sub">Детективные расследования туманного города</div>
      <div class="filters">${[['all', 'Все'], ['new', 'Новые'], ['prog', 'В процессе'], ['done', 'Раскрытые']].map(([k, l]) => `<button class="btn sm ${FILT === k ? 'gold' : ''}" data-f="${k}">${l}</button>`).join('')}<span class="chip">Раскрыто: <b>${CASES.filter(c => { const s2 = SAVE.cases[c.id]; return s2 && s2.accused && s2.accused.killerOk; }).length}</b> из ${CASES.length}</span></div>
      <div class="caselist">
      ${CASES.map((c, i) => { const st = SAVE.cases[c.id]; const done = st && st.accused && st.accused.killerOk; const k = done ? 'done' : st ? 'prog' : 'new'; if (FILT !== 'all' && FILT !== k) return ''; const ic = c._meta ? { murder: '🔪', poison: '🧪', theft: '💰', arson: '🔥' }[c._meta.crime] : '💎'; return `<div class="casecard" data-n="${c.num || i + 1}" data-c="${c.id}"><span class="cic">${ic}</span><h3>${esc(c.title)}</h3><div class="m">${esc(c.subtitle)}</div><div style="margin-top:10px;font-weight:600;font-size:13.5px">${done ? `✅ ${st.accused.score}/100 · ${esc(st.accused.rank)}` : st ? '🔎 В процессе' : (i === 0 ? '⭐ Авторское дело' : 'Новое дело')}</div></div>`; }).join('')}
      </div>
      <div style="display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;justify-content:center"><span class="chip" style="padding:9px 14px">🕵️ ${esc(USER)}</span><button class="btn" id="lo">Сменить детектива</button><button class="btn" id="snd">${SAVE.settings.sound ? '🔊 Звук включён' : '🔈 Звук выключен'}</button>${NATIVE ? '<button class="btn red" id="quit">⏻ Выйти из игры</button>' : ''}</div>${NATIVE ? '<div class="hint" style="margin-top:12px">F11 — переключить полноэкранный и оконный режим</div>' : ''}</div>`;
    document.querySelectorAll('.filters [data-f]').forEach(b => b.onclick = () => { FILT = b.dataset.f; screenTitle(); });
    document.querySelectorAll('.casecard[data-c]').forEach(d => d.onclick = () => {
      const id = d.dataset.c, st = SAVE.cases[id];
      if (!st) { openCase(id, true); return; }
      popup(`<h2>${esc(CASES.find(c => c.id === id).title)}</h2><p>Продолжить расследование или начать заново?</p>`, m => {
        const r = m.querySelector('.row');
        r.insertAdjacentHTML('afterbegin', '<button class="btn red" id="rs">Начать заново</button><button class="btn gold" id="ct">Продолжить</button>');
        m.querySelector('#ct').onclick = () => { closeOv(); openCase(id, false); };
        m.querySelector('#rs').onclick = () => { closeOv(); openCase(id, true); };
      });
    });
    $('#snd').onclick = () => { SAVE.settings.sound = !SAVE.settings.sound; persist(); screenTitle(); };
    $('#lo').onclick = logout;
    const q = $('#quit'); if (q) q.onclick = askQuit;
  }

  // кнопка «Назад» в Android-приложении
  const WV = /; wv\)/.test(navigator.userAgent);
  function armBack() { if (WV) { try { history.pushState({ hp: 1 }, ''); } catch (e) { /* ignore */ } } }
  window.addEventListener('popstate', () => {
    if (!WV) return;
    const ovs = document.querySelectorAll('.ov');
    if (ovs.length) {
      const top = ovs[ovs.length - 1];
      const btn = ['#cx', '#dec', '#end', '#bye', '#pc', '#x', '#cl'].map(s => top.querySelector(s)).find(Boolean);
      if (btn) btn.click(); else top.remove();
      armBack(); return;
    }
    if (S && C) {
      const back = document.querySelector('#content #back');
      if (back) back.click();
      else if (S.view !== 'case') { S.view = 'case'; renderView(); }
      else { persist(); clearInterval(tickT); screenTitle(); }
      armBack(); return;
    }
    toast('Нажмите «Назад» ещё раз, чтобы выйти');
  });
  window.addEventListener('beforeunload', () => { try { if (USER) STORE.profiles[USER].save = SAVE; const d = JSON.stringify(STORE); if (NATIVE && navigator.sendBeacon) navigator.sendBeacon('/api/save', d); localStorage.setItem('homepolice_v4', d); } catch (e) { /* ignore */ } });
  document.addEventListener('visibilitychange', () => { if (document.hidden && USER) writeStore(); });
  // ---------- автообновление (Android) ----------
  const UPD = 'https://chipoffofficial-ship-it.github.io/home-police/game/';
  async function checkUpdate() {
    if (!WV) return;
    try {
      const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 8000);
      const v = await (await fetch(UPD + 'version.json?t=' + Date.now(), { cache: 'no-store', signal: ctl.signal })).json();
      clearTimeout(tm);
      const cur = window.HP_VERSION || 0;
      let cached = null; try { cached = JSON.parse(localStorage.getItem('hp_game_cache') || 'null'); } catch (e) { /* ignore */ }
      if (!v || !(v.version > cur) || (cached && cached.ver >= v.version)) { if (cached && cached.ver > cur) offerReload(cached.ver); return; }
      const html = await (await fetch(UPD + 'game.html?v=' + v.version, { cache: 'no-store' })).text();
      if (html.indexOf('name="hp-version" content="' + v.version + '"') < 0 || html.length < 100000) return;
      localStorage.setItem('hp_game_cache', JSON.stringify({ ver: v.version, html }));
      offerReload(v.version);
    } catch (e) { /* нет интернета — играем в текущую версию */ }
  }
  function offerReload(ver) {
    const d = document.createElement('div'); d.className = 'toast ev'; d.style.bottom = '22px';
    d.innerHTML = `🔄 Загружено обновление игры. <button class="btn sm gold" style="margin-left:8px">Обновить</button>`;
    document.body.appendChild(d);
    d.querySelector('button').onclick = () => { try { if (USER) writeStore(); } catch (e) { /* ignore */ } setTimeout(() => location.reload(), 300); };
    setTimeout(() => d.remove(), 30000);
  }

  loadSave().then(async () => {
    setTimeout(checkUpdate, 1500);
    if (NATIVE) setInterval(() => fetch('/api/ping', { cache: 'no-store' }).catch(() => {}), 3000);
    armBack();
    if (STORE.auto && STORE.profiles[STORE.auto]) login(STORE.auto); else screenAuth();
  });
  window.__HP = { get S() { return S; }, get C() { return C; } };
})();
</script></body></html>
